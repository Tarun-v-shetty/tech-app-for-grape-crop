html body{background:var(--bg);font-family:Inter,"Avenir Next",Avenir,"Segoe UI",sans-serif;letter-spacing:.005em}
body main{max-width:820px;padding:28px 22px 48px}
.masthead{position:relative;isolation:isolate;overflow:hidden;padding:24px 26px 22px;margin:0 0 18px;border:1px solid var(--bd);border-radius:18px;background:linear-gradient(125deg,var(--card) 38%,var(--ac2));}
.masthead:after{content:"";position:absolute;z-index:-1;width:190px;height:190px;right:-34px;top:-78px;border:1px solid color-mix(in srgb,var(--ac) 24%,transparent);border-radius:50%;box-shadow:0 0 0 18px color-mix(in srgb,var(--ac) 5%,transparent),0 0 0 38px color-mix(in srgb,var(--ac) 4%,transparent)}
.masthead h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,5vw,2.55rem);font-weight:500;letter-spacing:-.035em;line-height:1.12;margin:24px 0 8px}
.masthead .sub{max-width:610px;font-size:.96rem;line-height:1.65;margin:0;color:var(--mu)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ac);font-size:.72rem;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
.brand-icon{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--bd);border-radius:11px;background:var(--card);font-size:1.15rem}
.lang{float:none}
.lang button{min-height:36px;padding:5px 11px}
.lang button.on{background:var(--ac);border-color:var(--ac);color:#fff}
body main nav{gap:8px;margin:0 0 18px;padding:5px;border:1px solid var(--bd);border-radius:13px;background:var(--card)}
body main nav button{min-height:46px;border-color:transparent;border-radius:9px;font-size:.94rem;font-weight:650;transition:background .16s ease,color .16s ease}
body main nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
body main .card{padding:22px;margin:12px 0;border-radius:15px;box-shadow:0 5px 18px rgba(35,50,35,.045)}
body main h2{font-size:1.18rem;letter-spacing:-.015em;margin:0 0 10px}
body main label{font-size:.88rem;font-weight:600;color:var(--tx);margin:14px 0 6px}
body main input,body main select{min-height:44px;padding:10px 12px;border-radius:9px;border-color:var(--bd);background:var(--card);transition:border-color .15s ease,box-shadow .15s ease}
body main input[type="file"]{min-height:auto;padding:8px;background:var(--bg)}
body main .row{gap:12px}
body main .chk{gap:11px;padding:11px 4px;border-color:var(--bd);font-weight:450}
body main .chk input{width:18px;height:18px;accent-color:var(--ac);margin:2px 0 0}
body main button.p{min-height:46px;padding:11px 18px;border-radius:9px;font-weight:700;transition:transform .15s ease,filter .15s ease}
body main .warn{padding:14px 16px;border:1px solid color-mix(in srgb,var(--wt) 18%,transparent);border-radius:12px;line-height:1.65}
body main .res{padding:13px 15px;border-radius:9px;line-height:1.65}
body main .badge{padding:3px 9px;font-weight:650}
body main th{font-weight:700;color:var(--mu)}
body main th,body main td{padding:10px 8px}
body main .sm{line-height:1.6}
.auth-card{max-width:480px;margin:48px auto}
.auth-card h2{font-family:Georgia,"Times New Roman",serif;font-size:1.6rem;font-weight:500}
.auth-card .p{width:100%}
.account-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 0 16px;padding:10px 14px;border:1px solid var(--bd);border-radius:11px;background:var(--card)}
.account-actions{display:flex;align-items:center;gap:10px}
.account-role{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ac)}
.status{padding:10px 13px;border:1px solid var(--bd);border-radius:9px;margin:10px 0;background:var(--card)}
.status.error{border-color:#c36b58;color:#9b3928;background:var(--bad)}
.admin-user{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
@media(max-width:560px){.auth-card{margin:28px auto}.account-bar{align-items:flex-start;flex-direction:column}.admin-user{grid-template-columns:1fr}}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 48%,transparent);outline-offset:2px}
button.p:hover{filter:brightness(1.08);transform:translateY(-1px)}
nav button:hover:not(.on),.lang button:hover:not(.on){background:var(--ac2)}
@media(max-width:560px){body main{padding:14px 14px 32px}.masthead{padding:18px 18px 20px;border-radius:15px}.masthead h1{margin-top:20px}.brand{font-size:.65rem;letter-spacing:.1em}.brand-icon{width:30px;height:30px}body main .card{padding:17px}body main .row{gap:9px}body main nav button{font-size:.86rem;padding-inline:2px}}
@media(max-width:380px){body main .row{grid-template-columns:1fr}.topline{align-items:flex-start}.lang{gap:3px}.lang button{padding-inline:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

<title>Tech App for Grape Crop</title>
<style>
:root{--bg:#f6f8f4;--card:#fff;--tx:#1d2a1d;--mu:#5b6b5b;--ac:#5b2a86;--ac2:#e9ddf3;--bd:#d8e0d4;--wa:#fff4d6;--wt:#6b4b00;--ok:#e3f3e3;--bad:#fde3e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a14;--card:#1e271e;--tx:#e8efe6;--mu:#a3b2a1;--ac:#c9a2ee;--ac2:#3a2850;--bd:#33423a;--wa:#3d3210;--wt:#f0d98a;--ok:#1f3a22;--bad:#4a2323;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a14;--card:#1e271e;--tx:#e8efe6;--mu:#a3b2a1;--ac:#c9a2ee;--ac2:#3a2850;--bd:#33423a;--wa:#3d3210;--wt:#f0d98a;--ok:#1f3a22;--bad:#4a2323;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:1.25rem;margin:4px 0 2px}h2{font-size:1.05rem;margin:0 0 8px}
.sub{color:var(--mu);font-size:.85rem;margin:0 0 10px}
nav{display:flex;gap:6px;margin:10px 0}nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){nav button.on{color:#141a14}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.warn{background:var(--wa);color:var(--wt);border-radius:10px;padding:10px;font-size:.85rem;margin:10px 0}
label{display:block;font-size:.85rem;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--bd);font-size:.92rem}.chk input{width:auto;margin-top:4px}
button.p{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer;margin-top:10px}
@media (prefers-color-scheme:dark){button.p{color:#141a14}}
button.g{background:none;border:0;color:var(--mu);cursor:pointer;font:inherit;font-size:.8rem}
.res{border-left:4px solid var(--ac);padding:8px 10px;margin:8px 0;background:var(--ac2);border-radius:6px}
.badge{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:10px;background:var(--ok)}.badge.s{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--bd)}
.wrap{overflow-x:auto}.hid{display:none}.sm{font-size:.8rem;color:var(--mu)}
.lang{display:flex;gap:4px;float:right}.lang button{padding:4px 10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit;font-size:.8rem}.lang button.on{background:var(--ac);color:#fff}img.ph{max-width:100%;max-height:240px;border-radius:10px;margin-top:8px;display:block}</style></head><body><main>

let lang='en',shown=false,wshown=false,ticks=new Set(),currentUser=null,L=[];
try{lang=localStorage.getItem('grape_lang')||(navigator.language||'').startsWith('kn')?'kn':'en';const sv=localStorage.getItem('grape_lang');if(sv)lang=sv}catch(e){}
const t=k=>I[lang][k];const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,options={}){const response=await fetch(path,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let data={};try{data=await response.json()}catch(e){}if(!response.ok){if(response.status===401&&currentUser){currentUser=null;showSignedOut()}throw new Error(data.error||t('requestFailed'))}return data}
function notify(message,error=false){const n=$('notice');n.textContent=message;n.classList.remove('hid','error');if(error)n.classList.add('error')}
function showSignedOut(){currentUser=null;$('app-shell').classList.add('hid');$('auth').classList.remove('hid');$('auth').querySelector('p').textContent=t('authIntro')}
function setAuthMode(signUp){$('name-wrap').classList.toggle('hid',!signUp);$('auth-title').textContent=t(signUp?'createTitle':'signIn');$('auth-submit').textContent=t(signUp?'createTitle':'signIn');$('auth-toggle').textContent=t(signUp?'signIn':'createAccount');$('auth-password').autocomplete=signUp?'new-password':'current-password';$('auth-password').minLength=12}
function roleLabel(role){return t(({farmer:'roleFarmer',advisor:'roleAdvisor',admin:'roleAdmin'})[role])}
async function loadPrices(){L=(await api('/api/prices')).prices;drawM()}
async function loadAdminUsers(){if(!currentUser||currentUser.role!=='admin')return;const {users}=await api('/api/admin/users');$('admin-panel').classList.remove('hid');$('users').innerHTML=users.map(u=>`<div class="admin-user"><span><b>${esc(u.name)}</b><br><span class="sm">${esc(u.email)}</span></span><select aria-label="${esc(t('userRole'))}: ${esc(u.name)}" data-user-id="${u.id}">${['farmer','advisor','admin'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${esc(roleLabel(r))}</option>`).join('')}</select></div>`).join('');$('users').querySelectorAll('select').forEach(s=>s.onchange=async()=>{try{await api(`/api/admin/users/${s.dataset.userId}/role`,{method:'PATCH',body:JSON.stringify({role:s.value})});notify(t('roleSaved'));await loadAdminUsers()}catch(e){notify(e.message,true);await loadAdminUsers()}})}
async function loadRecords(){if(!currentUser)return;const [{records:diagnoses},{records:weather}]=await Promise.all([api('/api/diagnoses'),api('/api/weather')]);const all=[...diagnoses.map(r=>({...r,kind:'diagnosis'})),...weather.map(r=>({...r,kind:'weather'}))].sort((a,b)=>b.created_at.localeCompare(a.created_at));$('records-panel').classList.toggle('hid',all.length===0);$('records').innerHTML=all.length?all.map(r=>{const detail=r.kind==='diagnosis'?`${esc(t('plantPart'))}: ${esc(r.plant_part)} · ${esc(JSON.parse(r.results).join(', ')||t('none'))}`:`${esc(t('hint'))}: ${esc(JSON.parse(r.hints).join(' · '))}`;return `<div class="res"><b>${r.kind==='diagnosis'?esc(t('dh')):esc(t('wh'))}</b>${currentUser.role!=='farmer'?` · ${esc(t('sourceUser'))}: ${esc(r.submitted_by)}`:''}<br>${detail}<br><span class="sm">${esc(r.created_at)}</span></div>`}).join(''):`<p class="sm">${esc(t('noRecords'))}</p>`}
async function refreshAccount(){const {user}=await api('/api/me');currentUser=user;$('auth').classList.add('hid');$('app-shell').classList.remove('hid');$('account-name').textContent=user.name;$('account-role').textContent=roleLabel(user.role);$('auth-password').value='';$('admin-panel').classList.toggle('hid',user.role!=='admin');if(user.role==='admin')await loadAdminUsers();await Promise.all([loadPrices(),loadRecords()])}
let signingUp=false;
$('auth-toggle').onclick=()=>{signingUp=!signingUp;setAuthMode(signingUp)};
$('auth-form').onsubmit=async e=>{e.preventDefault();const submit=$('auth-submit');submit.disabled=true;try{const payload={email:$('auth-email').value.trim(),password:$('auth-password').value};if(signingUp)payload.name=$('auth-name').value.trim();await api(signingUp?'/api/register':'/api/login',{method:'POST',body:JSON.stringify(payload)});await refreshAccount()}catch(error){$('auth').querySelector('p').textContent=error.message}finally{submit.disabled=false}};
$('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST',body:'{}'});showSignedOut();$('auth').querySelector('p').textContent=t('signedOut')}catch(e){notify(e.message,true)}};
function apply(){document.documentElement.lang=lang;document.title=t('title');
 document.querySelectorAll('[data-i]').forEach(e=>{const v=t(e.dataset.i);if(/<b>/.test(v))e.innerHTML=v;else e.textContent=v});
 document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 drawSyms();if(currentUser)drawM();setAuthMode(signingUp);if(shown)showD();if(wshown)showW()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('grape_lang',lang)}catch(e){}apply()});
setAuthMode(signingUp);
const part=$('part');
function drawSyms(){const p=part.value;let h='';D.forEach((d,i)=>d.s[p].forEach((x,j)=>{const k=p+i+'_'+j;h+=`<label class="chk"><input type="checkbox" data-k="${k}" data-d="${i}" ${ticks.has(k)?'checked':''}> <span>${x[lang]}</span></label>`}));$('syms').innerHTML=h;
 $('syms').querySelectorAll('input').forEach(c=>c.onchange=()=>c.checked?ticks.add(c.dataset.k):ticks.delete(c.dataset.k))}
part.onchange=()=>{shown=false;$('out').innerHTML='';drawSyms()};
let url='';$('pic').onchange=e=>{const f=e.target.files[0];if(url)URL.revokeObjectURL(url);if(!f){url='';$('pv').classList.add('hid');return}url=URL.createObjectURL(f);$('pv').src=url;$('pv').classList.remove('hid')};
async function showD(){shown=true;const sc=D.map(()=>0),tot=D.map(()=>0);
 document.querySelectorAll('#syms input').forEach(c=>{tot[c.dataset.d]++;if(c.checked)sc[c.dataset.d]++});const w=$('wx').value;
 const r=D.map((d,i)=>({d,v:tot[i]?sc[i]/tot[i]+(sc[i]&&w===d.w?.25:0):0,k:sc[i]})).filter(x=>x.k>0).sort((a,b)=>b.v-a.v);
 let h=`<div class="card"><h2>${t('matches')}</h2>`+(url?`<img class="ph" src="${url}" alt="">`:'');
 if(!r.length)h+=`<p>${t('none')}</p>`;
 r.forEach(x=>{const lv=x.v>=.9?t('l3'):x.v>=.5?t('l2'):t('l1');h+=`<div class="res"><b>${x.d.n[lang]}</b> <span class="badge">${lv}</span><br><span class="sm">${x.d.note[lang]}</span></div>`});
 if(r.length)h+=`<p class="sm">${t('rank')}</p>`;$('out').innerHTML=h+'</div>';
 try{await api('/api/diagnoses',{method:'POST',body:JSON.stringify({plant_part:part.value,symptoms:[...document.querySelectorAll('#syms input:checked')].map(c=>c.nextElementSibling.textContent),recent_weather:w,results:r.map(x=>x.d.n[lang])})});notify(t('diagnosisSaved'));await loadRecords()}catch(e){notify(e.message,true)}}
$('go').onclick=showD;

$('dt').valueAsDate=new Date();$('fi').valueAsDate=new Date();
function drawM(){const ex=+$('ex').value||0,m={};L.forEach(e=>{const k=e.market.toLowerCase()+'|'+e.variety.toLowerCase();if(!m[k]||e.price_date>m[k].price_date)m[k]=e});
 const rows=Object.values(m).map(e=>({e,kg:e.unit==='q'?e.price/100:e.price})).sort((a,b)=>b.kg-a.kg),now=new Date();
 $('tb').innerHTML=rows.length?rows.map(({e,kg})=>{const age=Math.floor((now-new Date(e.price_date))/864e5);return `<tr><td>${esc(e.market)}<br><span class="sm">${esc(e.source||'')}${currentUser.role!=='farmer'?` · ${esc(t('by'))} ${esc(e.submitted_by)}`:''}</span></td><td>${esc(e.variety)}</td><td>${kg.toFixed(1)}</td><td>${(kg-ex).toFixed(1)}</td><td>${esc(e.price_date)} ${age>3?`<span class="badge s">${t('old')}</span>`:''}${e.user_id===currentUser.id||currentUser.role==='admin'?` <button class="g" data-delete-price="${e.id}" aria-label="Delete ${esc(e.market)}">×</button>`:''}</td></tr>`}).join(''):`<tr><td colspan="5">${t('nop')}</td></tr>`;
 $('tb').querySelectorAll('[data-delete-price]').forEach(b=>b.onclick=async()=>{try{await api(`/api/prices/${b.dataset.deletePrice}`,{method:'DELETE'});await loadPrices()}catch(e){notify(e.message,true)}});
 $('clr').textContent=t(currentUser.role==='admin'?'clearAllPrices':'clr');
 $('mnote').textContent=rows.length>1?t('spread').replace('{x}',(rows[0].kg-rows[rows.length-1].kg).toFixed(1)):''}
$('add').onclick=async()=>{const entry={market:$('mk').value.trim(),variety:$('vr').value.trim()||t('grapes'),price:+$('pr').value,unit:$('un').value,price_date:$('dt').value,source:$('sr').value.trim()};
 if(!entry.market||!(entry.price>0)||!entry.price_date){notify(t('al'),true);return}try{await api('/api/prices',{method:'POST',body:JSON.stringify(entry)});$('pr').value='';await loadPrices();notify(t('priceSaved'))}catch(error){notify(error.message,true)}};
$('ex').oninput=drawM;$('clr').onclick=async()=>{const message=currentUser.role==='admin'?t('cc'):t('clearMineConfirm');if(confirm(message)){try{await api('/api/prices',{method:'DELETE'});await loadPrices()}catch(e){notify(e.message,true)}}};

async function showW(){wshown=true;const rc=+$('rc').value||0,rm=+$('rm').value||0,hu=+$('hu').value||0,sk=$('sk').value,tn=$('tn').value,tx=$('tx').value;
 const avg=(tn!==''&&tx!=='')?(+tn+ +tx)/2:null,wet=rc>=50||rm>=5||(hu>=80&&sk!=='clear'),pw=sk==='over'&&avg!==null&&avg>=20&&avg<=25&&rm<2,rain=rc>=40||rm>=2;
 const c=[['h1',wet,wet],['h2',pw,pw],['h3',rain,rc>=40],['h4',rm>=10,false],['h5',rc>=40,rc>=40]];
 const src=$('fs').value?`${t('base')} ${esc($('fs').value)}${$('fi').value?', '+t('iss')+' '+esc($('fi').value):''}.`:t('nos');
 const hints=c.map(([k,a])=>`${t(k)}: ${t(k+(a?'a':'b'))}`);
 $('wout').innerHTML=`<div class="card"><h2>${t('hint')}</h2>`+c.map(([k,a,f])=>`<div class="res"><b>${t(k)}</b> ${f?`<span class="badge s">${t('att')}</span>`:''}<br>${t(k+(a?'a':'b'))}</div>`).join('')+`<p class="sm">${src} ${t('unc')}</p></div>`;
 try{await api('/api/weather',{method:'POST',body:JSON.stringify({rain_chance:rc,expected_rain:rm,humidity:hu,sky:sk,min_temp:tn===''?null:+tn,max_temp:tx===''?null:+tx,source:$('fs').value.trim(),issued_on:$('fi').value||new Date().toISOString().slice(0,10),hints})});notify(t('weatherSaved'));await loadRecords()}catch(e){notify(e.message,true)}}
$('wg').onclick=showW;
const tabs=[...document.querySelectorAll('#nav button')];
function activateTab(tab){tabs.forEach(x=>{const active=x===tab;x.classList.toggle('on',active);x.setAttribute('aria-selected',active?'true':'false');x.tabIndex=active?0:-1});['d','m','w'].forEach(k=>$(k).classList.toggle('hid',k!==tab.dataset.t))}
tabs.forEach((tab,index)=>{tab.onclick=()=>activateTab(tab);tab.onkeydown=e=>{let next=index;if(e.key==='ArrowRight')next=(index+1)%tabs.length;else if(e.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=tabs.length-1;else return;e.preventDefault();tabs[next].focus();tabs[next].click()}});
